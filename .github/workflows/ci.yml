name: CI

on:
  push:
    branches: [ main, cursor/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Scan for secrets
        run: |
          echo "Scanning for accidentally committed credentials..."
          
          # Check for AWS access keys (AKIA...)
          if grep -r "AKIA[0-9A-Z]\{16\}" . --exclude-dir=.git --exclude-dir=.terraform 2>/dev/null; then
            echo "❌ ERROR: AWS access key detected"
            exit 1
          fi
          
          # Check for private keys
          if grep -r "BEGIN.*PRIVATE KEY" . --exclude-dir=.git --exclude-dir=.terraform 2>/dev/null; then
            echo "❌ ERROR: Private key detected"
            exit 1
          fi
          
          # Check for hardcoded passwords or secrets (common patterns)
          if grep -rE "(password|secret|token)\s*[:=]\s*['\"][^'\"]{20,}" . \
             --include="*.tf" --include="*.py" --include="*.sh" --include="*.yml" --include="*.yaml" \
             --exclude-dir=.git --exclude-dir=.terraform 2>/dev/null | \
             grep -vE "(random_password|SecureString|POSTGRES_PASSWORD|GRAFANA_ADMIN|ENCRYPTION_KEY|\$\{|Parameter Store)"; then
            echo "❌ ERROR: Potential hardcoded secret detected"
            exit 1
          fi
          
          # Check for .tfstate files
          if find . -name "*.tfstate*" -not -path "./.git/*" -not -path "./.terraform/*" | grep -q .; then
            echo "❌ ERROR: Terraform state file detected in repository"
            exit 1
          fi
          
          # Check for .env files
          if find . -name ".env*" -not -path "./.git/*" -not -name ".env.example" | grep -q .; then
            echo "❌ ERROR: Environment file (.env) detected in repository"
            exit 1
          fi
          
          echo "✅ No secrets detected"

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
    
    - name: Terraform Format Check
      working-directory: infra
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      working-directory: infra
      run: terraform init -backend=false
    
    - name: Terraform Validate
      working-directory: infra
      run: terraform validate

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --max-line-length=120 --exclude=__pycache__
    
    - name: Check formatting with black
      run: |
        black --check src/ tests/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing

  architecture-diagram:
    name: Validate Architecture Diagram
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Graphviz
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
    
    - name: Install diagrams
      run: |
        pip install diagrams
    
    - name: Generate architecture diagram
      run: |
        python docs/architecture.py
    
    - name: Verify diagram was generated
      run: |
        test -f docs/architecture.png
